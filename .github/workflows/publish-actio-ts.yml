# Publish `actio-ts` to npmjs, driven by a per-package tag.
#
# This is a monorepo, so releases are named per package: the only way anything publishes is pushing the tag
# `actio-ts/v<version>` — never a repo-wide `v*` (that would imply a release of doc/, actio-py, actio-go,
# agents/ too). The publishing job re-runs the whole gate on the exact checkout of the tag before uploading,
# and refuses if the tag does not match package.json.
#
# Requirements:
#   - repo secret NPM_TOKEN: an npm automation token with publish permission on `actio-ts`;
#   - the repository stays public (npm provenance attestations are verified against it);
#   - the checkout is the whole monorepo on purpose: `gen:check` reads `../doc/schemas`, outside actio-ts/.
#
# Not used here: `orchestra/env.sh` — that script exists to dodge the Bun shims on the build box; on CI the
# Node version comes from actions/setup-node.
name: publish actio-ts

on:
  push:
    tags:
      - "actio-ts/v*"

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  # The gate on both the floor of engines.node and the version the build box actually uses.
  gate:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actio-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: actio-ts/package-lock.json
      - run: npm ci
      - run: npm run check:publish

  publish:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actio-ts
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: actio-ts/package-lock.json

      - name: the tag must name this package's version
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/$pkg/v$ver" ]; then
            echo "refusing to publish: $GITHUB_REF is not $pkg/v$ver"
            exit 1
          fi

      - run: npm ci
      - name: the gate again, on the publishing checkout
        run: npm run check:publish
      - name: publish with provenance
        # --ignore-scripts so prepublishOnly does not run the gate a third time (the build already produced
        # dist/ in the step above). Unscoped package: no --access. npm refuses if package.json says private.
        run: npm publish --provenance --ignore-scripts

      - name: the registry serves it
        run: |
          ver=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if npm view "actio-ts@$ver" version; then exit 0; fi
            sleep 15
          done
          echo "actio-ts@$ver is not visible on the registry"
          exit 1
