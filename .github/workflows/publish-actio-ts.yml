# Publish `actio-ts` to npmjs, driven by a per-package tag.
#
# This is a monorepo, so releases are named per package: the only way anything publishes is pushing the tag
# `actio-ts/v<version>` — never a repo-wide `v*` (that would imply a release of doc/, actio-py, actio-go,
# agents/ too). The publishing job re-runs the whole gate on the exact checkout of the tag before uploading,
# and refuses if the tag does not match package.json.
#
# Credentials — npm is removing direct publishing with bypass-2FA tokens in January 2027, so this workflow
# has both paths and the migration is "delete the secret":
#
#   * Trusted publishing (the target): no secret at all. Configure the package on npmjs.com → Publishing from
#     CI/CD → Add trusted publisher → GitHub Actions, user `ludiazv`, repository `actio`, workflow filename
#     `publish-actio-ts.yml`, and tick **`npm publish`** under Allowed actions (a configuration created after
#     2026-09-03 allows only `npm stage publish` until you say otherwise). `id-token: write` below is what
#     makes the OIDC exchange work; provenance attestations are then generated automatically. The connection
#     cannot be edited afterwards — the workflow filename is a permanent commitment, and a new configuration
#     must complete a first successful publish within 2 days.
#   * A granular token (only for the first release, or until the configuration above exists): set the repo
#     secret NPM_TOKEN to a "Read and write (publish and stage)" granular token. A package must already exist
#     before it can have a trusted publisher, so the first version is published this way. This path stops
#     working in January 2027.
#
# The repository stays public (provenance is verified against it), and GitHub-hosted runners only — npm does
# not accept OIDC from self-hosted ones yet. The checkout is the whole monorepo on purpose: `gen:check` reads
# `../doc/schemas`, outside actio-ts/. Not used here: `orchestra/env.sh`, which exists to dodge the Bun shims
# on the build box; on CI the Node version comes from actions/setup-node.
name: publish actio-ts

on:
  push:
    tags:
      - "actio-ts/v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (and provenance on the token path)

jobs:
  # The gate on both the floor of engines.node and the version the build box actually uses.
  gate:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actio-ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: actio-ts/package-lock.json
      - run: npm ci
      - run: npm run check:publish

  publish:
    needs: gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: actio-ts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: actio-ts/package-lock.json

      - name: the tag must name this package's version
        run: |
          pkg=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF" != "refs/tags/$pkg/v$ver" ]; then
            echo "refusing to publish: $GITHUB_REF is not $pkg/v$ver"
            exit 1
          fi

      - run: npm ci
      - name: the gate again, on the publishing checkout
        run: npm run check:publish

      # Which credential exists decides which of the two publish steps below runs. A step-level `if:` cannot
      # mention the `secrets` context at all — GitHub rejects the entire file with "Unrecognized named-value:
      # 'secrets'" — so the comparison lives in this step's `env:` (where secrets are allowed) and the answer
      # travels as a step output. The shell only ever sees "true" or "false", never the token itself.
      - name: which credential is available
        id: credential
        env:
          HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$HAS_NPM_TOKEN" = "true" ]; then mode=token; else mode=oidc; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "publish step will use: $mode"

      # Deleting the NPM_TOKEN secret is therefore the whole migration to trusted publishing.
      # --ignore-scripts so prepublishOnly does not run the gate a third time (the step above produced dist/).
      # No --access flag: provenance refuses a new package unless the access is declared ("Can't generate
      # provenance for new or private package, you must set `access` to public"), and package.json carries that
      # as publishConfig.access, which pack-smoke checks. Same for --provenance: automatic under trusted
      # publishing, explicit on the token path.
      - name: publish with trusted publishing (no secret; provenance automatic)
        if: steps.credential.outputs.mode == 'oidc'
        run: npm publish --ignore-scripts

      - name: publish with a granular token (first release only; ends January 2027)
        if: steps.credential.outputs.mode == 'token'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --ignore-scripts

      - name: the registry serves it
        run: |
          ver=$(node -p "require('./package.json').version")
          for i in $(seq 1 12); do
            if npm view "actio-ts@$ver" version; then exit 0; fi
            sleep 15
          done
          echo "actio-ts@$ver is not visible on the registry"
          exit 1
